<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة Gemini الاحترافية</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; }
        label { font-weight: 600; display: block; margin: 15px 0 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background: #357abd; }
        #output { margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 4px solid var(--primary); min-height: 50px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h2>Gemini API Interface</h2>
    
    <label>أدخل مفتاح Gemini API:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
    
    <label>سؤالك:</label>
    <textarea id="userPrompt" placeholder="اكتب استفسارك هنا..."></textarea>
    
    <button onclick="askGemini()">إرسال الطلب</button>
    
    <div id="output">الرد سيظهر هنا...</div>
</div>

<script>
    async function askGemini() {
        const key = document.getElementById('apiKey').value.trim();
        const prompt = document.getElementById('userPrompt').value.trim();
        const output = document.getElementById('output');

        if (!key || !prompt) {
            alert("يرجى إدخال مفتاح الـ API والسؤال.");
            return;
        }

        output.innerText = "جاري الاتصال بـ Gemini...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            
            if (response.ok) {
                output.innerText = data.candidates[0].content.parts[0].text;
            } else {
                output.innerText = "خطأ: " + (data.error.message || "فشل الاتصال");
            }
        } catch (e) {
            output.innerText = "حدث خطأ في الشبكة: " + e.message;
        }
    }
</script>

</body>
</html>
