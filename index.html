<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو الذكي 🥩 | مساعد جيميناي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* تصميم مبسط ومتباين (أبيض وأسود وألوان واضحة) */
        :root {
            --bg: #ffffff;
            --surface: #f9fafb;
            --primary: #000000;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb; 
            --price: #166534;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 80px; }

        /* شريط المفتاح العلوي */
        .top-bar { background: var(--primary); padding: 15px 20px; display: flex; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .top-bar input { width: 100%; max-width: 600px; padding: 12px 20px; border-radius: 8px; border: none; font-size: 1rem; text-align: center; outline: none; }
        
        .header { text-align: center; padding: 40px 20px 20px; }
        .header h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; }

        /* حاوية المنيو */
        .menu-container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        .category-section { margin-bottom: 50px; }
        .category-title { font-size: 1.8rem; font-weight: 900; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 5px; margin-bottom: 25px; }
        .sub-category-title { font-size: 1.3rem; font-weight: 700; color: var(--text-muted); margin-bottom: 15px; }
        
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .item-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .item-card:hover { border-color: var(--primary); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .item-name { font-size: 1.15rem; font-weight: 900; margin-bottom: 8px; }
        .item-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; white-space: pre-line; margin-bottom: 15px; }
        .item-price { font-size: 1.25rem; font-weight: 900; color: var(--price); text-align: left; }

        /* زر الدردشة العائم */
        .chat-toggle-btn { position: fixed; bottom: 30px; left: 30px; background: var(--primary); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: none; z-index: 1000; transition: transform 0.2s; }
        .chat-toggle-btn:hover { transform: scale(1.05); }

        /* نافذة الدردشة */
        .chat-window { position: fixed; bottom: 110px; left: 30px; width: 380px; height: 500px; max-height: 70vh; background: var(--bg); border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid var(--border); display: flex; flex-direction: column; z-index: 999; transform: translateY(20px); opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .chat-window.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
        
        .chat-header { background: var(--primary); color: white; padding: 18px; text-align: center; font-weight: 900; font-size: 1.1rem; position: relative; }
        .close-chat { position: absolute; right: 18px; top: 18px; background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfdfd; }
        
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .msg.ai { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
        
        .typing-indicator { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-top: -5px; margin-bottom: 10px; display: none; padding: 0 5px; }
        
        .chat-input { padding: 15px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 0.95rem; }
        .chat-input input:focus { border-color: var(--primary); }
        .chat-input button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .chat-input button:disabled { background: var(--text-muted); cursor: not-allowed; }

        @media (max-width: 768px) {
            .chat-window { width: calc(100% - 40px); left: 20px; right: 20px; bottom: 100px; }
            .chat-toggle-btn { bottom: 20px; left: 20px; }
        }
    </style>
</head>
<body>

<!-- شريط المفتاح -->
<div class="top-bar">
    <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API هنا لتفعيل جيميناي...">
</div>

<div class="header">
    <h1>قائمة المنتجات 📋</h1>
</div>

<!-- حاوية المنيو -->
<div class="menu-container" id="menuContainer"></div>

<!-- المساعد الذكي -->
<button class="chat-toggle-btn" onclick="toggleChat()">💬</button>

<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        مساعدك الذكي جيميناي 🤖
        <button class="close-chat" onclick="toggleChat()">✖</button>
    </div>
    <div class="chat-messages" id="chatBox">
        <div class="msg ai">أهلاً بك! أنا مساعدك الخاص للمنيو. اسألني عن التفاصيل، الأسعار، أو حتى نصائح لطبخ هذه اللحوم والتوابل! 👨‍🍳</div>
    </div>
    <div class="typing-indicator" id="typingIndicator">جيميناي يكتب... ✍️</div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleEnter(event)">
        <button id="sendBtn" onclick="handleChatAction()">إرسال</button>
    </div>
</div>

<script>
    // --- 1. بيانات المنيو ---
    const menuData = {
      "categories": [
        {
          "id": "c1", "name": "اللحوم الباردة",
          "items": [
            { "name": "ببروني التغذية", "description": "المنشأ لبنان\nالتعبئة ٤٥٠ غرام", "price": "7", "currency": "$" },
            { "name": "حبش مدخن اسباني Bocatel", "description": "المنشأ اسباني \nالتعبئة 3 كغ", "price": "35", "currency": "$" },
            { "name": "بفاريا سجق 1 كغ", "description": "", "price": "70850", "currency": "ل.س", "unit": "قطعة" }
          ],
          "subcategories": [
            {
              "name": "مرتديلا بفاريا",
              "items": [
                { "name": "مرتديلا بفاريا دجاج 150 غرام", "description": "سادة_ زيتون _فلفل حب _ كوكتيل _بيتزا", "price": "10000", "currency": "ل.س" },
                { "name": "مرتديلا دجاج قالب 1 كغ", "description": "سادة_ زيتون _فلفل حب _ كوكتيل _بيتزا", "price": "43950", "currency": "ل.س" }
              ]
            },
            {
              "name": "هوت دوغ بفاريا",
              "items": [
                { "name": "هوت دوغ دجاج مدخن 250 غرام", "description": "العدد بالكيس 6 قطعة", "price": "13750", "currency": "ل.س" },
                { "name": "بفاريا هوت دوغ بقري ودجاج مدخن ١ كغ", "description": "التعبئة ١١ ، ١٦ ،٢٥ قطعة", "price": "54600", "currency": "ل.س" }
              ]
            }
          ]
        },
        {
          "id": "c2", "name": "التوابل والبهارات",
          "items": [
            { "name": "فلفل أبيض / أسود", "description": "تعبئة 1كغ", "price": "متغير", "currency": "" },
            { "name": "كزبرة ناعمة / حب", "description": "تعبئة 1كغ", "price": "متغير", "currency": "" },
            { "name": "بابريكا (حلوة / مدخنة)", "description": "تعبئة 1كغ", "price": "متغير", "currency": "" }
          ]
        }
      ]
    };

    // --- 2. بناء الواجهة ---
    function renderMenu() {
        const container = document.getElementById('menuContainer');
        let html = '';
        menuData.categories.forEach(category => {
            html += `<div class="category-section">`;
            html += `<div class="category-title">${category.name}</div>`;
            
            if (category.items && category.items.length > 0) {
                html += `<div class="items-grid">`;
                category.items.forEach(item => html += createCard(item));
                html += `</div>`;
            }

            if (category.subcategories) {
                category.subcategories.forEach(sub => {
                    html += `<div class="sub-category-title">${sub.name}</div>`;
                    html += `<div class="items-grid">`;
                    sub.items.forEach(item => html += createCard(item));
                    html += `</div>`;
                });
            }
            html += `</div>`;
        });
        container.innerHTML = html;
    }

    function createCard(item) {
        let priceStr = (item.price === "0" || item.price === "متغير") ? "السعر عند الطلب" : `${item.price} ${item.currency} ${item.unit ? '/'+item.unit : ''}`;
        return `
            <div class="item-card">
                <div>
                    <div class="item-name">${item.name}</div>
                    ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                </div>
                <div class="item-price">${priceStr}</div>
            </div>`;
    }
    renderMenu();

    // --- 3. قسم الدردشة وربط الـ API بنفس الطريقة السابقة تماماً ---
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const sendBtn = document.getElementById('sendBtn');
    const chatWindow = document.getElementById('chatWindow');

    function toggleChat() {
        chatWindow.classList.toggle('active');
        if (chatWindow.classList.contains('active')) chatInput.focus();
    }

    async function handleChatAction() {
        const apiKey = document.getElementById('apiKey').value.trim();
        let userMessage = chatInput.value.trim();

        if (!apiKey) return alert("يرجى إدخال مفتاح API في أعلى الصفحة أولاً!");
        if (!userMessage) return;

        addMessageToChat('user', userMessage);
        chatInput.value = '';
        
        await communicateWithGemini(apiKey, userMessage);
    }

    async function communicateWithGemini(apiKey, userMessage) {
        setLoading(true);

        // بناء الطلب لإعطاء جيميناي معلومات المنيو والطلب كـ JSON
        let prompt = `أنت المساعد الذكي الخاص بمتجرنا للحوم الباردة والتوابل. 
هذا هو المنيو الخاص بنا باختصار: ${JSON.stringify(menuData)}

رسالة العميل: "${userMessage}"

أجب على العميل بطريقة احترافية، ودودة، وقدم نصائح للطبخ أو مقارنات إذا لزم الأمر.

أمر هام جداً: يجب أن تكون استجابتك عبارة عن JSON صالح فقط (بدون أي علامات Markdown مثل \`\`\`json) لكي يتمكن نظامي من قراءته، ويحتوي على مفتاح واحد فقط:
{
  "reply": "رسالتك المكتوبة لي هنا بأسلوبك البشري المرح"
}`;

        // نفس الرابط والطريقة المستخدمة في كودك الأصلي
        const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gemini-3.6-flash", // نفس المودل والهيكلية الخاصة بك
                    input: prompt
                })
            });

            const data = await response.json();
            let rawReply = "";

            // نفس طريقة استخراج البيانات تماماً
            if (response.ok && data.steps) {
                for (const step of data.steps) {
                    if (step.type === "model_output" && step.content) {
                        for (const item of step.content) {
                            if (item.type === "text") {
                                rawReply += item.text;
                            }
                        }
                    }
                }

                // محاولة تحويل الرد إلى JSON كما في كودك
                let aiResponse;
                try {
                    let cleanJson = rawReply.replace(/```json/g, '').replace(/```/g, '').trim();
                    aiResponse = JSON.parse(cleanJson);
                } catch (e) {
                    console.error("فشل في قراءة الـ JSON:", rawReply);
                    aiResponse = { reply: rawReply }; // نظام احتياطي
                }

                if (aiResponse.reply) {
                    addMessageToChat('ai', formatText(aiResponse.reply));
                }

            } else {
                addMessageToChat('ai', "عذراً، حدث خطأ في النظام ولم أستطع الرد! ❌");
                console.log(data);
            }
        } catch (err) {
            console.error(err);
            addMessageToChat('ai', "انقطع الاتصال بي! تأكد من جودة الإنترنت أو مفتاح الـ API. 📡");
        } finally {
            setLoading(false);
        }
    }

    function addMessageToChat(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerHTML = text; 
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(isLoading) {
        chatInput.disabled = isLoading;
        sendBtn.disabled = isLoading;
        typingIndicator.style.display = isLoading ? 'block' : 'none';
        if (!isLoading) chatInput.focus();
    }

    function handleEnter(e) {
        if (e.key === 'Enter') handleChatAction();
    }

    function formatText(text) {
        return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }
</script>

</body>
</html>
