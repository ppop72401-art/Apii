<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد جيميناي الذكي</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --background-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #202124;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .info-note {
            background-color: #e8f0fe;
            color: #1967d2;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1557b0;
        }

        button:disabled {
            background-color: #aecbfa;
            cursor: not-allowed;
        }

        .response-area {
            background-color: #f1f3f4;
            padding: 20px;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
            line-height: 1.6;
            border: 1px solid #e8eaed;
        }

        .loading {
            color: #5f6368;
            font-style: italic;
        }

        .error {
            color: #d93025;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h1>مساعد جيميناي الذكي 🤖</h1>
        
        <div class="info-note">
            تم دمج مفتاح واجهة برمجة التطبيقات (API Key) داخل الكود بناءً على طلبك.
        </div>

        <div class="input-group">
            <textarea id="userInput" placeholder="اكتب سؤالك أو طلبك هنا..."></textarea>
            <button id="sendBtn" onclick="generateResponse()">إرسال</button>
        </div>

        <div id="responseArea" class="response-area">
            سيظهر رد جيميناي هنا...
        </div>
    </div>

    <script>
        // ==========================================
        // ضع مفتاح API الخاص بك بين علامتي التنصيص هنا
        // ==========================================
        const API_KEY = "YOUR_API_KEY_HERE"; 
        
        // بناءً على الوثائق، تم تحديث النموذج إلى gemini-1.5-flash أو gemini-3.6-flash
        // استخدام النموذج المتوفر والمستقر حالياً لطلبات الـ REST
        const MODEL_NAME = "gemini-1.5-flash"; 

        async function generateResponse() {
            const inputElement = document.getElementById('userInput');
            const responseElement = document.getElementById('responseArea');
            const btnElement = document.getElementById('sendBtn');
            const userText = inputElement.value.trim();

            if (!userText) {
                alert("الرجاء كتابة نص أولاً.");
                return;
            }

            if (API_KEY === "YOUR_API_KEY_HERE" || API_KEY === "") {
                responseElement.innerHTML = `<span class="error">خطأ: لم تقم بإدخال مفتاح API في الكود المصدري. الرجاء تعديل المتغير API_KEY.</span>`;
                return;
            }

            // تحديث حالة الواجهة
            inputElement.disabled = true;
            btnElement.disabled = true;
            responseElement.innerHTML = '<span class="loading">جاري معالجة الطلب... يرجى الانتظار ⏳</span>';

            // رابط نقطة النهاية (Endpoint) لـ Gemini API
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "حدث خطأ غير معروف أثناء الاتصال بالخادم.");
                }

                // استخراج وعرض الرد
                const aiResponse = data.candidates[0].content.parts[0].text;
                responseElement.innerText = aiResponse;

            } catch (error) {
                responseElement.innerHTML = `<span class="error">حدث خطأ: ${error.message}</span>`;
            } finally {
                // إعادة تفعيل الواجهة
                inputElement.disabled = false;
                btnElement.disabled = false;
                inputElement.focus();
            }
        }
    </script>
</body>
</html>
