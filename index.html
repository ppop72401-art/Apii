<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر Gemini Interactions API 🤖</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ca143;
            --primary-light: #e6f9ed;
            --bg: #f4f7f6;
            --surface: #ffffff;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--surface); padding: 25px; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; }
        input, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #e5e7eb; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--primary); }
        .btn-send { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-send:active { transform: scale(0.98); }
        .btn-send:disabled { background: var(--text-muted); cursor: not-allowed; }
        .response-box { margin-top: 20px; padding: 15px; background: var(--bg); border-radius: 12px; border: 1px solid #e5e7eb; min-height: 120px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-weight: 800; font-size: 0.8rem; margin-bottom: 10px; }
        .status-waiting { background: #e0f2fe; color: #0284c7; }
        .status-success { background: var(--primary-light); color: var(--primary); }
        .status-error { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>اختبار Gemini Interactions API 🤖</h1>

    <div class="input-group">
        <label>مفتاح API الخاص بك:</label>
        <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API الخاص بك هنا...">
    </div>

    <div class="input-group">
        <label>الأمر / السؤال (Prompt):</label>
        <textarea id="promptInput" rows="3" placeholder="اكتب سؤالاً أو أمراً لاختبار الـ API...">اكتب لي بيت شعر قصير عن القهوة</textarea>
    </div>

    <button class="btn-send" id="sendBtn" onclick="testGeminiInteractions()">
        <span>إرسال الاختبار (Interactions API) 🚀</span>
    </button>

    <div style="margin-top: 20px;">
        <span id="statusBadge" class="status-badge status-waiting">جاهز للاختبار</span>
        <div class="response-box" id="resultBox">ستظهر استجابة الذكاء الاصطناعي هنا...</div>
    </div>
</div>

<script>
async function testGeminiInteractions() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('promptInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    const statusBadge = document.getElementById('statusBadge');
    const sendBtn = document.getElementById('sendBtn');

    if (!apiKey) return alert("يرجى إدخال مفتاح API أولاً");
    if (!prompt) return alert("يرجى كتابة نص السؤال أو الأمر");

    sendBtn.disabled = true;
    statusBadge.className = 'status-badge status-waiting';
    statusBadge.innerText = 'جاري الاتصال بـ Gemini... ⏳';
    resultBox.innerText = 'جاري المعالجة...';

    // استخدام عنوان Interactions API الخاص بالنموذج الحديث gemini-3.6-flash
    const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "gemini-3.6-flash",
                input: prompt
            })
        });

        const data = await response.json();

        if (response.ok) {
            statusBadge.className = 'status-badge status-success';
            statusBadge.innerText = 'تم الاتصال بنجاح ✔️';
            
            // استخراج النص من مصفوفة steps الموضحة في مستندات API الجديدة
            let replyText = "";
            if (data.steps && data.steps.length > 0) {
                for (const step of data.steps) {
                    if (step.type === "model_output" && step.content) {
                        for (const item of step.content) {
                            if (item.type === "text") {
                                replyText += item.text;
                            }
                        }
                    }
                }
            }

            if (replyText) {
                resultBox.innerText = replyText;
            } else {
                resultBox.innerText = "وصلت الاستجابة بنجاح لكن بدون محتوى نصي:\n" + JSON.stringify(data, null, 2);
            }
        } else {
            statusBadge.className = 'status-badge status-error';
            statusBadge.innerText = `خطأ في الطلب (${response.status}) ❌`;
            resultBox.innerText = "تفاصيل الخطأ:\n" + JSON.stringify(data, null, 2);
        }
    } catch (err) {
        statusBadge.className = 'status-badge status-error';
        statusBadge.innerText = 'فشل الاتصال بالشريكة ❌';
        resultBox.innerText = "خطأ في الشبكة:\n" + err.message;
    } finally {
        sendBtn.disabled = false;
    }
}
</script>

</body>
</html>
